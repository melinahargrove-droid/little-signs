<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Empty Modern Boho name tag space">
  <defs>
    <filter id="wash" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.85 0 0 0 0.08  0 0.88 0 0 0.08  0 0 0.82 0 0.07  0 0 0 0.34 0" result="tint"/>
      <feGaussianBlur in="tint" stdDeviation="7" result="soft"/>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="676" height="276" rx="38" fill="#d9dfd0" opacity="0.78" filter="url(#wash)"/>
  <rect x="15" y="15" width="670" height="270" rx="36" fill="none" stroke="#8f7e68" stroke-width="6" stroke-dasharray="17 14" stroke-linecap="round" opacity="0.78" filter="url(#edge)"/>
</svg>